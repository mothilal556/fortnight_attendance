<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - FortNight Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <section class="main-card mx-auto" style="max-width: 480px;">
      <div class="card-heading">
        <div>
          <h1>Sign in to FortNight Attendance</h1>
          <p>Enter the shared access password to continue.</p>
        </div>
      </div>
      <div class="card-body">
        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post">
          <label for="password" class="form-label">Access password</label>
          <input class="form-control mb-3" type="password" id="password" name="password" required autofocus>
          <button class="btn btn-primary w-100" type="submit">Continue</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
